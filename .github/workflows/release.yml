name: macOS Build, Test and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    # Standard macos-14 and macos-15 labels are ARM64; also assert at runtime.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native toolchain
        run: |
          test "$(uname -m)" = arm64
          clang++ --version | grep 'Apple clang'
          cmake --version
          python3 --version
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build --parallel 3
      - name: Offline verification
        run: |
          ctest --test-dir build --output-on-failure --parallel 3
          python3 tests/native_artifacts.py build/bin
      - name: Package on oldest supported OS
        if: matrix.os == 'macos-14'
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-14'
        with:
          name: macos-arm64-release
          path: dist/*
          if-no-files-found: error

  archive-smoke:
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist
      - name: Verify macOS 14 archive on macOS 15
        run: |
          cd dist
          shasum -a 256 -c itu-ders-bot-macos-arm64.tar.gz.sha256
          cd ..
          python3 tests/native_artifacts.py dist/itu-ders-bot-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [native, archive-smoke]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "ITU Course Picker $RELEASE_TAG" --generate-notes
          fi
